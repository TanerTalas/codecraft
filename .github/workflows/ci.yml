# Her push ve PR'da tip kontrolü ve testler.
#
# 05-09-2026'ya kadar depoda hiç CI yoktu: `npm test` yalnızca biri elle
# çalıştırınca koşuyordu, ve `data.yml` de testleri hiç koşturmuyordu. Yani
# bozuk bir commit main'e geçebilirdi ve bunu hiçbir şey söylemezdi.
#
# Bu iş issue AÇMAZ — push/PR koşusunun kırmızısı zaten görünür. Issue açan
# yol günlük veri koşusu (`data.yml`), çünkü ona kimse bakmıyor.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# data.yml'nin tersine burada iptal SERBEST: orada yarıda kesilen bir koşu
# data/ push'unu yarım bırakabilir, burada eski koşunun sonucu zaten boşa gider.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Python bir alt süreç olarak açılıyor ve
      # packages/validator/test/python.test.ts `syntaxChecked === true` diye
      # sabitliyor — yorumlayıcı yoksa o test düşer. Runner imajının
      # varsayılanına bırakılmıyor, açıkça kuruluyor.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
